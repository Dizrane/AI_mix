name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run test suite
        run: swift test

  release:
    name: Build and publish app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changelog against the previous release tag can be generated
      - name: Resolve version
        run: echo "VERSION=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_ENV"
      - name: Build universal release binary
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Assemble .app bundle
        run: |
          APP="AI Mix Assistant.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp AppInfo.plist "$APP/Contents/Info.plist"
          cp Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION#v}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$APP/Contents/Info.plist"
          cp ".build/apple/Products/Release/AI Mix Assistant" "$APP/Contents/MacOS/AI Mix Assistant"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
      - name: Zip app inside its closed-shell folder
        run: |
          FOLDER="AI_Mix_$VERSION"
          mkdir "$FOLDER"
          mv "AI Mix Assistant.app" "$FOLDER/"
          ditto -c -k --sequesterRsrc --keepParent "$FOLDER" "AI-Mix-Assistant-$VERSION-macos-universal.zip"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)
          : > notes.md
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            echo "## Что нового по сравнению с $PREV" >> notes.md
            echo >> notes.md
            git log "$PREV"..HEAD --no-merges --pretty='- %s' >> notes.md
            echo >> notes.md
          fi
          cat >> notes.md <<'EOF'
          ## Установка

          1. Скачайте `AI-Mix-Assistant-*.zip` ниже и распакуйте — получится папка `AI_Mix_<версия>` с приложением внутри.
          2. Перенесите **всю папку** куда угодно (например в `~/Applications`) и запускайте приложение только изнутри неё: программа хранит все свои данные рядом с собой в этой папке, и удаление папки удаляет программу целиком со всеми данными.
          3. Первый запуск: кликните по `AI Mix Assistant.app` правой кнопкой → «Открыть» → «Открыть» (приложение не нотаризовано Apple, поэтому обычный двойной клик macOS заблокирует; после первого раза запускается как обычно).
          4. Выдайте приложению разрешение Accessibility, когда оно предложит (System Settings → Privacy & Security → Accessibility).

          ## Требования

          - macOS 14 или новее (Apple Silicon и Intel — бинарник универсальный).
          - Logic Pro с английским интерфейсом (обнаружение треков и экспорт привязаны к английским названиям элементов).
          EOF
          gh release create "$VERSION" \
            "AI-Mix-Assistant-$VERSION-macos-universal.zip" \
            --title "AI Mix Assistant $VERSION" \
            --notes-file notes.md
